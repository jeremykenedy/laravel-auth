<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 408" width="392" height="408">
  <style>.shackle,.pulse,.press{transform-box:fill-box;transform-origin:center}.type{transform-box:fill-box;transform-origin:left center;animation:type 8s ease-in-out infinite}.dot-1{animation:dot-1 8s linear infinite}.dot-2{animation:dot-2 8s linear infinite}.dot-3{animation:dot-3 8s linear infinite}.dot-4{animation:dot-4 8s linear infinite}.dot-5{animation:dot-5 8s linear infinite}.press{animation:press 8s ease-in-out infinite}.shackle{animation:unlock 8s ease-in-out infinite}.pulse{animation:click 8s ease-out infinite}.social{animation:twinkle 3s ease-in-out infinite alternate}.social-b{animation-delay:-1s}.social-c{animation-delay:-2s}@keyframes type{0%,12%{transform:scaleX(0);opacity:1}30%,92%{transform:scaleX(1);opacity:1}97%,to{transform:scaleX(1);opacity:0}}@keyframes dot-1{0%,33%{opacity:0}35%,92%{opacity:1}97%,to{opacity:0}}@keyframes dot-2{0%,37%{opacity:0}39%,92%{opacity:1}97%,to{opacity:0}}@keyframes dot-3{0%,41%{opacity:0}43%,92%{opacity:1}97%,to{opacity:0}}@keyframes dot-4{0%,45%{opacity:0}47%,92%{opacity:1}97%,to{opacity:0}}@keyframes dot-5{0%,49%{opacity:0}51%,92%{opacity:1}97%,to{opacity:0}}@keyframes press{0%,53%{transform:scale(1)}55%{transform:scale(.9)}58%,to{transform:scale(1)}}@keyframes unlock{0%,58%{transform:translateY(0) rotate(0)}66%{transform:translateY(-12px) rotate(0)}71%,84%{transform:translateY(-12px) rotate(10deg)}88%{transform:translateY(-12px) rotate(0)}93%,to{transform:translateY(0) rotate(0)}}@keyframes click{0%,92%{transform:scale(1);opacity:0}93%{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}@keyframes twinkle{0%{opacity:.4}to{opacity:1}}@media (prefers-reduced-motion:reduce){.type,.dot,.press,.shackle,.pulse,.social{animation:none}}</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="392" height="408" rx="16" fill="url(#bg)"/>

  <text x="20" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="-.5" fill="#fff">Laravel Auth</text>
  <text x="20" y="104" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a8a29e">Laravel 13 authentication, roles,</text>
  <text x="20" y="122" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a8a29e">social login &amp; user profiles</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">
    <rect x="20" y="140" width="78" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#a78bfa" stroke-width=".8"/>
    <text x="59" y="154.5" fill="#a78bfa">Social Login</text>

    <rect x="106" y="140" width="119" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8"/>
    <text x="165.5" y="154.5" fill="#60a5fa">Roles &amp; Permissions</text>

    <rect x="233" y="140" width="43" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#4ade80" stroke-width=".8"/>
    <text x="254.5" y="154.5" fill="#4ade80">2FA</text>

    <rect x="284" y="140" width="78" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#fbbf24" stroke-width=".8"/>
    <text x="323" y="154.5" fill="#fbbf24">Soft Deletes</text>

    <rect x="20" y="170" width="78" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#f87171" stroke-width=".8"/>
    <text x="59" y="184.5" fill="#f87171">Activity Log</text>
  </g>

  <g transform="translate(80.5,208) scale(1.35)">
    <rect width="150" height="130" rx="12" fill="#1a1a1a" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="75" cy="30" r="20" fill="#2e1065"/>
    <circle cx="75" cy="26" r="6.5" fill="#a78bfa"/>
    <rect x="64" y="36" width="22" height="12" rx="6" fill="#a78bfa"/>
    <rect x="20" y="58" width="100" height="12" rx="6" fill="#0c0a09" stroke="#6d28d9"/>
    <rect class="type" x="25" y="61" width="60" height="6" rx="3" fill="#a78bfa"/>
    <rect x="20" y="76" width="100" height="12" rx="6" fill="#0c0a09" stroke="#6d28d9"/>
    <g fill="#c4b5fd">
      <circle class="dot dot-1" cx="30" cy="82" r="2.2"/>
      <circle class="dot dot-2" cx="38" cy="82" r="2.2"/>
      <circle class="dot dot-3" cx="46" cy="82" r="2.2"/>
      <circle class="dot dot-4" cx="54" cy="82" r="2.2"/>
      <circle class="dot dot-5" cx="62" cy="82" r="2.2"/>
    </g>
    <rect class="press" x="45" y="92" width="60" height="14" rx="7" fill="#8b5cf6"/>
    <circle class="social" cx="55" cy="118" r="6" fill="#60a5fa"/>
    <circle class="social social-b" cx="75" cy="118" r="6" fill="#f87171"/>
    <circle class="social social-c" cx="95" cy="118" r="6" fill="#4ade80"/>
    <g transform="translate(118,44) scale(.75)">
      <path class="shackle" d="M16 58V35C16 3 64 3 64 35V72" fill="none" stroke="#a78bfa" stroke-width="9"/>
      <rect x="10" y="50" width="60" height="55" rx="10" fill="#8b5cf6"/>
      <circle class="pulse" cx="40" cy="72" r="7" fill="none" stroke="#fff" stroke-width="2" opacity="0"/>
      <circle cx="40" cy="72" r="6" fill="#161412"/>
      <rect x="37" y="76" width="6" height="14" fill="#161412"/>
    </g>
  </g>
</svg>
